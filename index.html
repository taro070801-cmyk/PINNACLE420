<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>英単語マスター 420</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #f4f6f8;
      --card-bg: #ffffff;
      --primary-color: #3b82f6;
      --primary-hover: #2563eb;
      --success-color: #10b981;
      --warning-color: #f59e0b;
      --danger-color: #ef4444;
      --text-main: #1f2937;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
      --radius: 12px;
      --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 28px;
      position: relative;
    }

    .hidden {
      display: none !important;
    }

    h1, h2 {
      text-align: center;
      color: var(--text-main);
      margin-bottom: 20px;
      font-weight: 700;
    }

    /* Menu Screen */
    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: 600;
      font-size: 0.9rem;
      color: var(--text-main);
    }

    select, input {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      font-size: 1rem;
      font-family: inherit;
      background-color: #fafafa;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--primary-color);
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s ease, transform 0.1s ease;
      margin-top: 10px;
    }

    .btn:hover {
      background-color: var(--primary-hover);
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-secondary {
      background-color: #6b7280;
    }
    .btn-secondary:hover {
      background-color: #4b5563;
    }

    .btn-danger {
      background-color: var(--danger-color);
    }
    .btn-danger:hover {
      background-color: #dc2626;
    }

    /* Top Bar in Quiz */
    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      font-size: 0.9rem;
      color: var(--text-sub);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background-color: #e5e7eb;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .progress-fill {
      height: 100%;
      background-color: var(--primary-color);
      width: 0%;
      transition: width 0.3s ease;
    }

    /* Word Display Area */
    .word-card {
      background-color: #f9fafb;
      border: 1px solid var(--border-color);
      border-radius: var(--radius);
      padding: 24px;
      text-align: center;
      margin-bottom: 20px;
      position: relative;
      min-height: 220px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .word-number {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-sub);
    }

    .streak-badge {
      position: absolute;
      top: 12px;
      right: 16px;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 2px 8px;
      border-radius: 12px;
      background-color: #e0f2fe;
      color: #0369a1;
    }

    .word-english {
      font-size: 2.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      color: var(--text-main);
    }

    .word-phonetic {
      font-size: 0.95rem;
      color: var(--text-sub);
      margin-top: 4px;
      font-family: serif;
    }

    .word-japanese {
      font-size: 1.3rem;
      font-weight: 700;
      color: var(--primary-color);
      margin-top: 12px;
    }

    .word-example {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px dashed var(--border-color);
      font-size: 0.9rem;
      color: #374151;
      text-align: left;
      width: 100%;
    }

    .word-example-en {
      font-style: italic;
      margin-bottom: 4px;
    }

    .word-example-ja {
      color: var(--text-sub);
      font-size: 0.85rem;
    }

    /* 4-Choice Options */
    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-bottom: 20px;
    }

    .option-btn {
      padding: 14px;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      background: white;
      text-align: left;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
      font-family: inherit;
    }

    .option-btn:hover {
      background-color: #f3f4f6;
      border-color: #d1d5db;
    }

    .option-btn.correct {
      background-color: #d1fae5 !important;
      border-color: var(--success-color) !important;
      color: #065f46;
    }

    .option-btn.wrong {
      background-color: #fee2e2 !important;
      border-color: var(--danger-color) !important;
      color: #991b1b;
    }

    /* Flashcard Controls */
    .flashcard-controls {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    /* Stats Banner */
    .stats-summary {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      background: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      text-align: center;
      margin-bottom: 20px;
      font-size: 0.85rem;
    }

    .stats-val {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--text-main);
    }

    /* List Screen */
    .list-container {
      max-height: 450px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      margin-bottom: 20px;
    }

    .list-item {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .list-item:last-child {
      border-bottom: none;
    }

    .list-item-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .list-info {
      display: flex;
      gap: 10px;
      align-items: center;
    }

    .list-num {
      font-size: 0.85rem;
      color: var(--text-sub);
      width: 42px;
      font-weight: 600;
    }

    .list-word {
      font-weight: 700;
      font-size: 1.05rem;
    }

    .list-phonetic {
      font-size: 0.85rem;
      color: var(--text-sub);
      margin-left: 6px;
      font-weight: normal;
    }

    .list-meaning {
      font-size: 0.9rem;
      color: var(--primary-color);
      font-weight: 600;
      margin-left: 52px;
      margin-bottom: 4px;
    }

    .list-ex {
      font-size: 0.8rem;
      color: var(--text-sub);
      margin-left: 52px;
      background: #fafafa;
      padding: 6px 10px;
      border-radius: 6px;
    }

    .status-tag {
      font-size: 0.75rem;
      padding: 2px 8px;
      border-radius: 12px;
      font-weight: 600;
    }

    .tag-unlearned { background: #f3f4f6; color: #4b5563; }
    .tag-learning { background: #fef3c7; color: #b45309; }
    .tag-remembered { background: #dbeafe; color: #1d4ed8; }
    .tag-perfect { background: #d1fae5; color: #047857; }
  </style>
</head>
<body>

  <div class="container">
    
    <!-- メニュー画面 -->
    <div id="menu-screen">
      <h1>英単語マスター (1〜420)</h1>
      
      <div class="form-group">
        <label for="mode-select">学習モード</label>
        <select id="mode-select">
          <option value="choice">4択クイズ</option>
          <option value="flashcard">フラッシュカード</option>
        </select>
      </div>

      <div class="form-group">
        <label for="count-select">出題数</label>
        <select id="count-select">
          <option value="5">5問</option>
          <option value="10" selected>10問</option>
          <option value="20">20問</option>
          <option value="50">50問</option>
          <option value="all">全問 (420問)</option>
        </select>
      </div>

      <div class="form-group">
        <label for="timer-select">制限時間（1問あたり）</label>
        <select id="timer-select">
          <option value="0">なし</option>
          <option value="3">3秒</option>
          <option value="5" selected>5秒</option>
          <option value="10">10秒</option>
        </select>
      </div>

      <div class="form-group">
        <label for="filter-select">出題対象</label>
        <select id="filter-select">
          <option value="all">すべての単語 (1〜420)</option>
          <option value="unlearned">未マスターのみ (正解数5未満)</option>
          <option value="weak">苦手な単語 (ミスあり)</option>
        </select>
      </div>

      <button class="btn" id="start-btn">学習を開始する</button>
      <button class="btn btn-secondary" id="view-list-btn">単語一覧を見る</button>
    </div>

    <!-- クイズ・学習画面 -->
    <div id="quiz-screen" class="hidden">
      <div class="quiz-header">
        <span id="quiz-progress-text">1 / 10</span>
        <span id="timer-display" style="font-weight: 700; color: var(--danger-color);"></span>
        <button id="abort-btn" class="btn-danger" style="padding: 4px 10px; font-size: 0.8rem; border: none; border-radius: 4px; cursor: pointer;">中断</button>
      </div>

      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill"></div>
      </div>

      <div class="word-card" id="word-card">
        <span class="word-number" id="card-word-num">No. 1</span>
        <span class="streak-badge" id="card-streak-badge">連続正解: 0</span>
        <div class="word-english" id="card-english">corroborate</div>
        <div class="word-phonetic" id="card-phonetic">/kəˈrɑːbəreɪt/</div>
        
        <!-- 正解時またはフラッシュカードめくり時に表示 -->
        <div class="word-japanese hidden" id="card-japanese">確証する</div>
        <div class="word-example hidden" id="card-example">
          <div class="word-example-en" id="card-ex-en">The evidence corroborates his story.</div>
          <div class="word-example-ja" id="card-ex-ja">その証拠が彼の説明を確証している。</div>
        </div>
      </div>

      <!-- 4択モードの選択肢 -->
      <div id="choice-container" class="options-grid">
        <button class="option-btn" data-idx="0"></button>
        <button class="option-btn" data-idx="1"></button>
        <button class="option-btn" data-idx="2"></button>
        <button class="option-btn" data-idx="3"></button>
      </div>

      <!-- フラッシュカードモードの操作ボタン -->
      <div id="flashcard-container" class="flashcard-controls hidden">
        <button class="btn btn-danger" id="fc-wrong-btn">わからなかった (間違えた)</button>
        <button class="btn" id="fc-correct-btn" style="background-color: var(--success-color);">覚えている (正解)</button>
      </div>
    </div>

    <!-- 結果画面 -->
    <div id="result-screen" class="hidden">
      <h2>学習結果</h2>
      
      <div class="stats-summary">
        <div>
          <div>回答数</div>
          <div class="stats-val" id="res-total">0</div>
        </div>
        <div>
          <div>正解</div>
          <div class="stats-val" id="res-correct" style="color: var(--success-color);">0</div>
        </div>
        <div>
          <div>不正解</div>
          <div class="stats-val" id="res-wrong" style="color: var(--danger-color);">0</div>
        </div>
      </div>

      <button class="btn" id="retry-btn">もう一度挑戦</button>
      <button class="btn btn-secondary" id="back-menu-btn">メニューに戻る</button>
    </div>

    <!-- 一覧画面 -->
    <div id="list-screen" class="hidden">
      <h2>単語一覧 (1〜420)</h2>
      <div class="list-container" id="list-container">
        <!-- JSで一覧生成 -->
      </div>
      <button class="btn btn-secondary" id="list-back-btn">メニューに戻る</button>
    </div>

  </div>

  <script>
    // 全420単語データ（番号、英単語、発音記号、日本語訳、例文）
    const wordList = [
      { num: 1, en: "corroborate", ph: "/kəˈrɑːbəreɪt/", ja: "確証する", exEn: "The evidence corroborates his story.", exJa: "その証拠が彼の説明を確証している。" },
      { num: 2, en: "substantiate", ph: "/səbˈstænʃieɪt/", ja: "立証する", exEn: "We need facts to substantiate the claim.", exJa: "主張を立証するための事実が必要だ。" },
      { num: 3, en: "hype", ph: "/haɪp/", ja: "誇大宣伝", exEn: "Don't believe all the media hype.", exJa: "メディアの誇大宣伝をすべて信じてはいけない。" },
      { num: 4, en: "unwavering", ph: "/ʌnˈweɪvərɪŋ/", ja: "揺るぎない", exEn: "She showed unwavering support for her friend.", exJa: "彼女は友人に対して揺るぎない支持を示した。" },
      { num: 5, en: "fervent", ph: "/ˈfɜːrvənt/", ja: "熱心な、熱烈な；熱い", exEn: "He is a fervent believer in free speech.", exJa: "彼は言論の自由の熱烈な信奉者だ。" },
      { num: 6, en: "avid", ph: "/ˈævɪd/", ja: "熱心な", exEn: "She is an avid reader of classic literature.", exJa: "彼女は古典文学の熱心な読者だ。" },
      { num: 7, en: "frenzy", ph: "/ˈfrenzi/", ja: "激高、狂乱", exEn: "The crowd was in a shopping frenzy.", exJa: "群衆は買い物の狂乱状態にあった。" },
      { num: 8, en: "ardent", ph: "/ˈɑːrdnt/", ja: "熱心な", exEn: "He is an ardent supporter of the team.", exJa: "彼はそのチームの熱心なサポーターだ。" },
      { num: 9, en: "ephemeral", ph: "/ɪˈfemərəl/", ja: "つかの間の；一日限りの", exEn: "Fame in the digital age can be ephemeral.", exJa: "デジタル時代の名声はつかの間のものになり得る。" },
      { num: 10, en: "fleeting", ph: "/ˈfliːtɪŋ/", ja: "つかの間の", exEn: "We caught a fleeting glimpse of the deer.", exJa: "私たちはシカのつかの間の姿を目撃した。" },
      { num: 11, en: "upheaval", ph: "/ʌpˈhiːvl/", ja: "大変動", exEn: "The war caused major political upheaval.", exJa: "その戦争は政治的な大変動を引き起こした。" },
      { num: 12, en: "prowess", ph: "/ˈpraʊəs/", ja: "優れた能力", exEn: "He is famous for his athletic prowess.", exJa: "彼は優れた運動能力で有名だ。" },
      { num: 13, en: "savvy", ph: "/ˈsævi/", ja: "実際的知識のある, 経験豊かな", exEn: "She is a tech-savvy entrepreneur.", exJa: "彼女はテクノロジーに精通した起業家だ。" },
      { num: 14, en: "dire", ph: "/ˈdaɪər/", ja: "恐ろしいほどの", exEn: "The country faces a dire economic crisis.", exJa: "その国は恐ろしいほどの経済危機に直面している。" },
      { num: 15, en: "wane", ph: "/weɪn/", ja: "衰える", exEn: "His influence began to wane.", exJa: "彼の影響力は衰え始めた。" },
      { num: 16, en: "underscore", ph: "/ˌʌndərˈskɔːr/", ja: "強調する", exEn: "The report underscores the need for reform.", exJa: "その報告書は改革の必要性を強調している。" },
      { num: 17, en: "downright", ph: "/ˈdaʊnraɪt/", ja: "完全に", exEn: "His behavior was downright rude.", exJa: "彼の態度は完全に無礼だった。" },
      { num: 18, en: "meticulous", ph: "/məˈtɪkjələs/", ja: "綿密な、細心な", exEn: "She paid meticulous attention to detail.", exJa: "彼女は細部に綿密な注意を払った。" },
      { num: 19, en: "unscrupulous", ph: "/ʌnˈskruːpjələs/", ja: "不誠実な", exEn: "Unscrupulous dealers cheated the customers.", exJa: "不誠実な業者が顧客をだました。" },
      { num: 20, en: "frivolous", ph: "/ˈfrɪvələs/", ja: "軽薄な", exEn: "Don't waste money on frivolous things.", exJa: "軽薄なものにお金を無駄使いするな。" },
      { num: 21, en: "flimsy", ph: "/ˈflɪmzi/", ja: "見え透いた、壊れやすい", exEn: "He made a flimsy excuse for being late.", exJa: "彼は遅刻の言い訳に見え透いた説明をした。" },
      { num: 22, en: "remorse", ph: "/rɪˈmɔːrs/", ja: "深い悔恨、自責の念", exEn: "He felt deep remorse for his actions.", exJa: "彼は自分の行動に深い自責の念を感じた。" },
      { num: 23, en: "mitigate", ph: "/ˈmɪtɪɡeɪt/", ja: "和らげる、軽くする", exEn: "Steps were taken to mitigate the risks.", exJa: "リスクを和らげるための対策が講じられた。" },
      { num: 24, en: "palliative", ph: "/ˈpæliətɪv/", ja: "一時的に緩和する", exEn: "The measure is only a palliative solution.", exJa: "その措置は一時的に緩和する解決策に過ぎない。" },
      { num: 25, en: "quell", ph: "/kwel/", ja: "鎮圧する", exEn: "Police were called to quell the riot.", exJa: "暴動を鎮圧するために警察が呼ばれた。" },
      { num: 26, en: "laudable", ph: "/ˈlɔːdəbl/", ja: "称賛に値する", exEn: "Her dedication to charity is laudable.", exJa: "彼女の慈善活動への献身は称賛に値する。" },
      { num: 27, en: "crystallize", ph: "/ˈkrɪstəlaɪz/", ja: "結晶化する", exEn: "Our plans began to crystallize after the meeting.", exJa: "会議の後、私たちの計画は具体化（結晶化）し始めた。" },
      { num: 28, en: "vehement", ph: "/ˈviːəmənt/", ja: "熱烈な", exEn: "There was vehement opposition to the plan.", exJa: "その計画には熱烈な反対があった。" },
      { num: 29, en: "construe", ph: "/kənˈstruː/", ja: "解釈する", exEn: "His silence was construed as agreement.", exJa: "彼の沈黙は同意と解釈された。" },
      { num: 30, en: "exacerbate", ph: "/ɪɡˈzæsərbeɪt/", ja: "悪化させる", exEn: "Stress can exacerbate health problems.", exJa: "ストレスは健康問題を悪化させることがある。" },
      { num: 31, en: "superfluous", ph: "/suːˈpɜːrfluəs/", ja: "余分な；不必要な", exEn: "Please delete all superfluous words.", exJa: "余分な単語はすべて削除してください。" },
      { num: 32, en: "redundant", ph: "/rɪˈdʌndənt/", ja: "余分な", exEn: "The explanation was redundant and unnecessary.", exJa: "その説明は余分で不要だった。" },
      { num: 33, en: "antidote", ph: "/ˈæntidoʊt/", ja: "解毒剤", exEn: "Laughter is a great antidote to stress.", exJa: "笑いはストレスに対する優れた解毒剤だ。" },
      { num: 34, en: "panacea", ph: "/ˌpænəˈsiːə/", ja: "万能薬", exEn: "Technology is not a panacea for all problems.", exJa: "テクノロジーはすべての問題に対する万能薬ではない。" },
      { num: 35, en: "posit", ph: "/ˈpɑːzɪt/", ja: "仮定する", exEn: "Scientists posit that life exists elsewhere.", exJa: "科学者たちは他の場所にも生命が存在すると仮定している。" },
      { num: 36, en: "cripple", ph: "/ˈkrɪpl/", ja: "身体を不自由にする", exEn: "The disease can cripple young children.", exJa: "その病気は幼い子供の身体を不自由にする可能性がある。" },
      { num: 37, en: "torment", ph: "/ˈtɔːrment/", ja: "ひどく苦しめる", exEn: "Bad memories continued to torment him.", exJa: "悪い記憶が彼をひどく苦しめ続けた。" },

    optionBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        const isCorrect = e.target.dataset.correct === "true";
        
        // 日本語訳と例文を表示
        cardJapanese.classList.remove('hidden');
        cardExample.classList.remove('hidden');

        // ボタン色変更
        optionBtns.forEach(b => {
          if (b.dataset.correct === "true") b.classList.add('correct');
          else b.classList.add('wrong');
          b.disabled = true;
        });

        setTimeout(() => {
          optionBtns.forEach(b => {
            b.classList.remove('correct', 'wrong');
            b.disabled = false;
          });
          handleAnswer(isCorrect);
        }, 1200);
      });
    });

    // クイズ開始処理
    function startQuiz() {
      currentMode = modeSelect.value;
      timerLimit = parseInt(timerSelect.value, 10);
      const countVal = countSelect.value;
      const filterVal = filterSelect.value;

      // フィルタリング
      let filtered = wordList.filter(item => {
        const stat = getStat(item.num);
        if (filterVal === 'unlearned') return stat.streak < 5;
        if (filterVal === 'weak') return stat.wrongCount > 0;
        return true;
      });

      if (filtered.length === 0) {
        alert('条件に一致する単語がありません。');
        return;
      }

      // シャッフル
      filtered.sort(() => Math.random() - 0.5);

      // 出題数の決定
      const totalQuestions = countVal === 'all' ? filtered.length : Math.min(parseInt(countVal, 10), filtered.length);
      quizQueue = filtered.slice(0, totalQuestions);

      currentIndex = 0;
      sessionStats = { correct: 0, wrong: 0 };

      if (currentMode === 'choice') {
        choiceContainer.classList.remove('hidden');
        flashcardContainer.classList.add('hidden');
      } else {
        choiceContainer.classList.add('hidden');
        flashcardContainer.classList.remove('hidden');
      }

      showScreen(quizScreen);
      loadQuestion();
    }

    // 問題の読み込み
    function loadQuestion() {
      clearInterval(timerInterval);
      
      if (currentIndex >= quizQueue.length) {
        finishQuiz();
        return;
      }

      const currentWord = quizQueue[currentIndex];
      const stat = getStat(currentWord.num);

      // プログレスバー
      const pct = ((currentIndex) / quizQueue.length) * 100;
      progressFill.style.width = `${pct}%`;
      progressText.textContent = `${currentIndex + 1} / ${quizQueue.length}`;

      // カード表示
      cardWordNum.textContent = `No. ${currentWord.num}`;
      
      let statusText = `連続正解: ${stat.streak}`;
      if (stat.streak >= 5) statusText += " (完璧)";
      else if (stat.streak >= 3) statusText += " (修得)";
      cardStreakBadge.textContent = statusText;

      cardEnglish.textContent = currentWord.en;
      cardPhonetic.textContent = currentWord.ph;
      cardJapanese.textContent = currentWord.ja;
      cardExEn.textContent = currentWord.exEn;
      cardExJa.textContent = currentWord.exJa;

      // 初期状態では隠す
      cardJapanese.classList.add('hidden');
      cardExample.classList.add('hidden');

      if (currentMode === 'choice') {
        setupOptions(currentWord);
      }

      // タイマー処理
      if (timerLimit > 0) {
        timeLeft = timerLimit;
        timerDisplay.textContent = `${timeLeft}s`;
        timerInterval = setInterval(() => {
          timeLeft--;
          timerDisplay.textContent = `${timeLeft}s`;
          if (timeLeft <= 0) {
            clearInterval(timerInterval);
            handleAnswer(false); // 時間切れは不正解
          }
        }, 1000);
      } else {
        timerDisplay.textContent = '';
      }
    }

    // 4択選択肢の作成
    function setupOptions(correctWord) {
      const dummyOptions = wordList
        .filter(w => w.num !== correctWord.num)
        .sort(() => Math.random() - 0.5)
        .slice(0, 3);

      const options = [...dummyOptions, correctWord].sort(() => Math.random() - 0.5);

      optionBtns.forEach((btn, idx) => {
        btn.textContent = `${idx + 1}. ${options[idx].ja}`;
        btn.dataset.correct = (options[idx].num === correctWord.num) ? "true" : "false";
      });
    }

    // 回答処理
    function handleAnswer(isCorrect) {
      clearInterval(timerInterval);
      const currentWord = quizQueue[currentIndex];
      const stat = getStat(currentWord.num);

      if (isCorrect) {
        stat.streak += 1;
        sessionStats.correct += 1;
      } else {
        stat.streak = 0; // 連続正解リセット
        stat.wrongCount += 1; // 間違えた回数を加算
        sessionStats.wrong += 1;
      }

      saveStats();
      currentIndex++;
      loadQuestion();
    }

    // 途中中断
    function abortQuiz() {
      if (confirm("学習を中断してメニューに戻りますか？")) {
        clearInterval(timerInterval);
        showScreen(menuScreen);
      }
    }

    // 終了処理
    function finishQuiz() {
      document.getElementById('res-total').textContent = quizQueue.length;
      document.getElementById('res-correct').textContent = sessionStats.correct;
      document.getElementById('res-wrong').textContent = sessionStats.wrong;
      showScreen(resultScreen);
    }

    // 一覧画面の表示
    function renderListScreen() {
      const listContainer = document.getElementById('list-container');
      listContainer.innerHTML = '';

      wordList.forEach(item => {
        const stat = getStat(item.num);
        const div = document.createElement('div');
        div.className = 'list-item';

        let tagClass = 'tag-unlearned';
        let tagText = '未着手';

        if (stat.streak >= 5) {
          tagClass = 'tag-perfect';
          tagText = '完璧 (5連勝)';
        } else if (stat.streak >= 3) {
          tagClass = 'tag-remembered';
          tagText = '修得 (3連勝)';
        } else if (stat.streak > 0 || stat.wrongCount > 0) {
          tagClass = 'tag-learning';
          tagText = `学習中 (${stat.streak}連勝)`;
        }

        div.innerHTML = `
          <div class="list-item-top">
            <div class="list-info">
              <span class="list-num">No.${item.num}</span>
              <span class="list-word">${item.en}</span>
              <span class="list-phonetic">${item.ph}</span>
            </div>
            <div>
              <span class="status-tag ${tagClass}">${tagText}</span>
              <span style="font-size: 0.75rem; color: var(--danger-color); margin-left: 6px;">ミス:${stat.wrongCount}</span>
            </div>
          </div>
          <div class="list-meaning">${item.ja}</div>
          <div class="list-ex">
            <div>${item.exEn}</div>
            <div style="color: var(--text-sub);">${item.exJa}</div>
          </div>
        `;
        listContainer.appendChild(div);
      });

      showScreen(listScreen);
    }
  </script>
</body>
</html>
