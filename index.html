<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PINNACLE 420 - 英単語学習アプリ</title>
  <style>
    :root {
      --primary: #0a2540;
      --accent: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-muted: #64748b;
      --correct: #10b981;
      --wrong: #ef4444;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      background: var(--card-bg);
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      min-height: 600px;
    }

    /* Header Design */
    header {
      background-color: var(--primary);
      color: white;
      padding: 24px;
      text-align: center;
      position: relative;
      border-bottom: 4px solid var(--accent);
    }

    header h1 {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: 2px;
    }

    header p {
      font-size: 12px;
      opacity: 0.8;
      margin-top: 4px;
      letter-spacing: 1px;
    }

    /* Common Layouts */
    .screen {
      padding: 24px;
      display: flex;
      flex-direction: column;
      flex: 1;
      justify-content: space-between;
    }

    .hidden {
      display: none !important;
    }

    /* Button Styles */
    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 14px 20px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      text-align: center;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .btn-secondary {
      background-color: transparent;
      color: var(--primary);
      border: 2px solid var(--primary);
    }

    .btn-group {
      display: flex;
      gap: 12px;
      flex-direction: column;
    }

    /* Home Screen */
    .stats-card {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
      text-align: center;
    }

    .stats-number {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }

    /* Quiz Screen */
    .progress-bar {
      width: 100%;
      height: 6px;
      background: #e2e8f0;
      border-radius: 3px;
      margin-bottom: 16px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--accent);
      width: 0%;
      transition: width 0.3s;
    }

    .word-card {
      text-align: center;
      margin-bottom: 24px;
    }

    .word-title {
      font-size: 32px;
      font-weight: 800;
      color: var(--primary);
    }

    .phonetic {
      font-size: 14px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .audio-btn {
      background: none;
      border: none;
      font-size: 20px;
      cursor: pointer;
      margin-left: 8px;
    }

    .options-grid {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 20px;
    }

    .option-btn {
      background: #f8fafc;
      border: 2px solid var(--border);
      padding: 14px;
      border-radius: 10px;
      font-size: 16px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s;
    }

    .option-btn.correct {
      background-color: #d1fae5;
      border-color: var(--correct);
      color: #065f46;
    }

    .option-btn.wrong {
      background-color: #fee2e2;
      border-color: var(--wrong);
      color: #991b1b;
    }

    /* Detail / Sentence Display */
    .example-box {
      background: #f1f5f9;
      border-left: 4px solid var(--accent);
      padding: 12px;
      border-radius: 4px;
      margin-top: 12px;
      font-size: 14px;
      text-align: left;
    }

    .example-en {
      font-weight: 600;
      color: var(--text);
    }

    .example-ja {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <header>
      <h1>PINNACLE 420</h1>
      <p>UNIVERSITY ENTRANCE EXAM VOCABULARY</p>
    </header>

    <!-- HOME SCREEN -->
    <div id="screen-home" class="screen">
      <div>
        <div class="stats-card">
          <p style="font-size: 12px; color: var(--text-muted);">習得率</p>
          <div class="stats-number" id="mastery-rate">0%</div>
          <p style="font-size: 12px; color: var(--text-muted); margin-top: 4px;" id="stats-detail">0 / 222 単語完了</p>
        </div>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="startQuiz('all')">全単語からテスト (10問)</button>
        <button class="btn btn-secondary" onclick="startQuiz('weak')">苦手・未習得単語からテスト</button>
      </div>
    </div>

    <!-- QUIZ SCREEN -->
    <div id="screen-quiz" class="screen hidden">
      <div>
        <div class="progress-bar"><div id="progress" class="progress-fill"></div></div>
        <div class="word-card">
          <div style="display: flex; justify-content: center; align-items: center;">
            <span id="quiz-word" class="word-title">word</span>
            <button class="audio-btn" onclick="speakCurrentWord()">🔊</button>
          </div>
          <div id="quiz-phonetic" class="phonetic">/ ... /</div>
        </div>
        <div id="options" class="options-grid"></div>
        <div id="example-container" class="example-box hidden">
          <div id="example-en" class="example-en"></div>
          <div id="example-ja" class="example-ja"></div>
        </div>
      </div>
      <button id="next-btn" class="btn hidden" onclick="nextQuestion()">次へ</button>
    </div>

    <!-- RESULT SCREEN -->
    <div id="screen-result" class="screen hidden">
      <div style="text-align: center; margin-top: 40px;">
        <h2 style="font-size: 24px; color: var(--primary);">テスト完了！</h2>
        <div style="font-size: 48px; font-weight: 800; color: var(--accent); margin: 20px 0;" id="result-score">0 / 10</div>
        <p id="result-msg" style="color: var(--text-muted);"></p>
      </div>
      <button class="btn" onclick="showHome()">ホームに戻る</button>
    </div>
  </div>

    // LocalStorage State Management
    let wordList = [];
    let currentQuiz = [];
    let currentIndex = 0;
    let score = 0;

    function initData() {
      const stored = localStorage.getItem('pinnacle_word_data');
      if (stored) {
        wordList = JSON.parse(stored);
      } else {
        wordList = rawWords.map((item, index) => ({
          id: index,
          word: item[0],
          meaning: item[1],
          phonetic: item[2],
          exEn: item[3],
          exJa: item[4],
          status: 'unlearned', // 'unlearned', 'learned', 'weak'
          correctCount: 0
        }));
        saveData();
      }
      updateHomeStats();
    }

    function saveData() {
      localStorage.setItem('pinnacle_word_data', JSON.stringify(wordList));
    }

    function updateHomeStats() {
      const learned = wordList.filter(w => w.status === 'learned').length;
      const rate = Math.round((learned / wordList.length) * 100);
      document.getElementById('mastery-rate').innerText = rate + '%';
      document.getElementById('stats-detail').innerText = `${learned} / ${wordList.length} 単語完了`;
    }

    // UI View Controllers
    function showHome() {
      updateHomeStats();
      document.getElementById('screen-home').classList.remove('hidden');
      document.getElementById('screen-quiz').classList.add('hidden');
      document.getElementById('screen-result').classList.add('hidden');
    }

    function startQuiz(mode) {
      let pool = [];
      if (mode === 'weak') {
        pool = wordList.filter(w => w.status !== 'learned');
        if (pool.length === 0) pool = wordList; // Fallback if everything is learned
      } else {
        pool = [...wordList];
      }

      // Shuffle and pick up to 10
      pool.sort(() => Math.random() - 0.5);
      currentQuiz = pool.slice(0, 10);
      currentIndex = 0;
      score = 0;

      document.getElementById('screen-home').classList.add('hidden');
      document.getElementById('screen-quiz').classList.remove('hidden');
      document.getElementById('screen-result').classList.add('hidden');

      renderQuestion();
    }

    function renderQuestion() {
      const item = currentQuiz[currentIndex];
      
      // Update UI Progress
      document.getElementById('progress').style.width = `${((currentIndex) / currentQuiz.length) * 100}%`;
      document.getElementById('quiz-word').innerText = item.word;
      document.getElementById('quiz-phonetic').innerText = item.phonetic;
      
      // Example Setup
      document.getElementById('example-en').innerText = item.exEn;
      document.getElementById('example-ja').innerText = item.exJa;
      document.getElementById('example-container').classList.add('hidden');
      document.getElementById('next-btn').classList.add('hidden');

      // Generate 4 Options
      const optionsContainer = document.getElementById('options');
      optionsContainer.innerHTML = '';

      let choices = [item.meaning];
      while (choices.length < 4) {
        const randomItem = wordList[Math.floor(Math.random() * wordList.length)];
        if (!choices.includes(randomItem.meaning)) {
          choices.push(randomItem.meaning);
        }
      }
      choices.sort(() => Math.random() - 0.5);

      choices.forEach(choice => {
        const btn = document.createElement('button');
        btn.className = 'option-btn';
        btn.innerText = choice;
        btn.onclick = () => handleAnswer(choice, item, btn);
        optionsContainer.appendChild(btn);
      });

      // Automatically speak English word
      speakCurrentWord();
    }

    function handleAnswer(selectedMeaning, currentItem, btnElement) {
      const allBtns = document.querySelectorAll('.option-btn');
      allBtns.forEach(b => b.onclick = null); // Disable further clicking

      const isCorrect = selectedMeaning === currentItem.meaning;
      
      if (isCorrect) {
        btnElement.classList.add('correct');
        score++;
        // Upgrade Status
        const masterItem = wordList.find(w => w.id === currentItem.id);
        masterItem.correctCount += 1;
        if (masterItem.correctCount >= 2) {
          masterItem.status = 'learned';
        }
      } else {
        btnElement.classList.add('wrong');
        // Show correct button
        allBtns.forEach(b => {
          if (b.innerText === currentItem.meaning) {
            b.classList.add('correct');
          }
        });
        // Downgrade Status
        const masterItem = wordList.find(w => w.id === currentItem.id);
        masterItem.status = 'weak';
        masterItem.correctCount = 0;
      }

      saveData();
      
      // Reveal example and next button
      document.getElementById('example-container').classList.remove('hidden');
      document.getElementById('next-btn').classList.remove('hidden');
    }

    function nextQuestion() {
      currentIndex++;
      if (currentIndex < currentQuiz.length) {
        renderQuestion();
      } else {
        finishQuiz();
      }
    }

    function finishQuiz() {
      document.getElementById('screen-quiz').classList.add('hidden');
      document.getElementById('screen-result').classList.remove('hidden');
      document.getElementById('result-score').innerText = `${score} / ${currentQuiz.length}`;
      
      const msg = document.getElementById('result-msg');
      if (score === currentQuiz.length) {
        msg.innerText = "素晴らしい！完璧です！";
      } else if (score >= 7) {
        msg.innerText = "素晴らしいペースです。間違えた単語を復習しましょう。";
      } else {
        msg.innerText = "苦手単語から繰り返しトレーニングしましょう！";
      }
    }

    function speakCurrentWord() {
      if ('speechSynthesis' in window) {
        const text = currentQuiz[currentIndex].word;
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = 'en-US';
        speechSynthesis.speak(utterance);
      }
    }

    // App Initialize
    window.onload = initData;
  </script>
