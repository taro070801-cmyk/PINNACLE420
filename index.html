<!DOCTYPE html>
<html lang="ja">
<head>
<!-- iOS / Android ホーム画面追加用アイコン -->
<link rel="apple-touch-icon" sizes="180x180" href="icon.jpeg">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>大学入試 無敵の難単語 PINNACLE 420 完全版</title>
  <style>
    :root {
      --main-blue: #0b2583;
      --bg-gray: #d8d8d8;
      --text-black: #111111;
      --accent-red: #d90429;
      --accent-green: #2b9348;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-gray);
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS Mincho", serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 10px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background-color: #ffffff;
      border: 1px solid #ccc;
      box-shadow: 0 4px 15px rgba(0,0,0,0.15);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      min-height: 650px;
    }

    /* ヘッダー */
    .header-top {
      display: flex;
      align-items: center;
      padding: 10px 14px 4px 14px;
      gap: 8px;
    }

    .badge-top {
      background-color: var(--main-blue);
      color: #fff;
      font-size: 1.1rem;
      font-weight: bold;
      padding: 2px 8px;
      letter-spacing: 2px;
      font-family: sans-serif;
    }

    .sub-title {
      font-size: 0.85rem;
      color: var(--text-black);
      font-weight: bold;
    }

    .main-title {
      text-align: center;
      font-size: 1.5rem;
      letter-spacing: 3px;
      color: var(--text-black);
      margin: 2px 0 6px 0;
      line-height: 1.2;
    }

    /* ナビゲーションタブ */
    .nav-tabs {
      display: flex;
      border-bottom: 2px solid var(--main-blue);
      background: #f0f0f0;
      font-family: sans-serif;
    }

    .tab-btn {
      flex: 1;
      padding: 8px 4px;
      border: none;
      background: none;
      font-weight: bold;
      font-size: 0.85rem;
      color: #555;
      cursor: pointer;
    }

    .tab-btn.active {
      background: var(--main-blue);
      color: #fff;
    }

    /* 各画面切り替え用 */
    .view-panel {
      display: none;
      flex-direction: column;
      flex: 1;
      padding: 10px;
    }

    .view-panel.active {
      display: flex;
    }

    /* --- 設定画面 --- */
    .config-group {
      margin-bottom: 12px;
      font-family: sans-serif;
    }

    .config-group label {
      display: block;
      font-weight: bold;
      font-size: 0.85rem;
      margin-bottom: 4px;
      color: var(--main-blue);
    }

    .config-group select, .config-group input {
      width: 100%;
      padding: 6px;
      font-size: 0.9rem;
      border: 1px solid #ccc;
      border-radius: 4px;
    }

    .start-btn {
      background: var(--main-blue);
      color: #fff;
      border: none;
      padding: 10px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
      font-family: sans-serif;
    }

    /* --- 学習カード共通 --- */
    .pinnacle-box {
      border: 5px solid var(--main-blue);
      margin: 0 5px 8px 5px;
      padding: 10px 12px;
      text-align: center;
      background: linear-gradient(135deg, rgba(255,255,255,0.95), rgba(230,235,250,0.95));
      position: relative;
      touch-action: pan-y;
      user-select: none;
    }

    .word-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 4px;
    }

    .word-number {
      font-family: sans-serif;
      font-weight: bold;
      color: var(--main-blue);
      font-size: 0.85rem;
    }

    .pinnacle-text {
      font-family: 'Arial Black', Impact, sans-serif;
      font-size: 1.2rem;
      color: var(--main-blue);
      letter-spacing: 3px;
      border-bottom: 2px solid var(--main-blue);
    }

    .question-word {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 1.8rem;
      font-weight: 900;
      color: var(--main-blue);
      margin: 4px 0;
      word-break: break-word;
    }

    .phonetic-symbol {
      font-family: "Lucida Sans Unicode", sans-serif;
      font-size: 0.9rem;
      color: #555;
      margin-bottom: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .audio-btn {
      background: none;
      border: none;
      font-size: 1.1rem;
      cursor: pointer;
    }

    .meaning-display {
      font-family: sans-serif;
      font-size: 1.1rem;
      font-weight: bold;
      color: var(--accent-red);
      margin: 6px 0;
      min-height: 1.5em;
    }

    .example-sentence {
      font-family: sans-serif;
      font-size: 0.8rem;
      color: #333;
      background: #f0f3fa;
      padding: 6px 8px;
      border-radius: 4px;
      border-left: 3px solid var(--main-blue);
      text-align: left;
      margin-top: 4px;
      line-height: 1.3;
    }

    /* タイマー */
    .timer-container {
      width: 100%;
      background-color: #e0e0e0;
      height: 6px;
      border-radius: 3px;
      overflow: hidden;
      margin-top: 6px;
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background-color: var(--main-blue);
      transition: width 0.05s linear;
    }

    .timer-text {
      font-family: sans-serif;
      font-size: 0.7rem;
      color: var(--main-blue);
      margin-top: 2px;
      font-weight: bold;
    }

    /* 4択オプション */
    .options-section {
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 5px;
    }

    .option-btn {
      background-color: #fff;
      border: 2px solid #ccc;
      padding: 8px 10px;
      font-family: sans-serif;
      font-size: 0.9rem;
      font-weight: bold;
      color: #333;
      text-align: left;
      cursor: pointer;
      border-radius: 4px;
    }

    .option-btn.correct {
      border-color: var(--accent-red) !important;
      background-color: #ffe6e6 !important;
      color: var(--accent-red) !important;
    }

    .option-btn.wrong {
      border-color: #999 !important;
      background-color: #eee !important;
      opacity: 0.6;
    }

    /* アクションエリア */
    .action-section {
      min-height: 45px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 4px;
    }

    .status-message {
      font-family: sans-serif;
      font-weight: bold;
      font-size: 0.85rem;
    }
    .status-message.timeout { color: var(--accent-red); }
    .status-message.correct-text { color: var(--main-blue); }
    .status-message.wrong-text { color: var(--accent-red); }

    .next-btn {
      background-color: var(--main-blue);
      color: #fff;
      border: none;
      padding: 6px 20px;
      font-size: 0.9rem;
      font-family: sans-serif;
      font-weight: bold;
      cursor: pointer;
      border-radius: 4px;
      display: none;
    }

    /* フラッシュカード操作系 */
    .flash-controls {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-top: 8px;
    }

    .flash-btn {
      flex: 1;
      padding: 10px;
      border: none;
      font-weight: bold;
      color: #fff;
      border-radius: 4px;
      cursor: pointer;
      font-family: sans-serif;
    }
    .btn-ng { background: var(--accent-red); }
    .btn-ok { background: var(--accent-green); }

    /* 単語一覧 */
    .list-container {
      overflow-y: auto;
      max-height: 420px;
      font-family: sans-serif;
    }

    .list-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid #eee;
      font-size: 0.85rem;
    }

    .list-item .word-info { flex: 1; }
    .list-item .word-en { font-weight: bold; color: var(--main-blue); }
    .list-item .word-ja { color: #555; }
    .status-badge {
      font-size: 0.75rem;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: bold;
    }
    .status-0 { background: #eee; color: #666; }
    .status-1 { background: #e3f2fd; color: #0d47a1; }
    .status-2 { background: #e8f5e9; color: #1b5e20; }

    /* フッター帯 */
    .footer-banner {
      background-color: var(--main-blue);
      color: #fff;
      text-align: center;
      padding: 8px 5px;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: auto;
    }
    .footer-banner span { font-size: 0.8rem; font-weight: normal; }
  </style>
</head>
<body>

<div class="container">
  <!-- ヘッダー -->
  <div class="header-top">
    <div class="badge-top">頂点</div>
    <div class="sub-title">を目指す人のための「仕上げの英単語集」</div>
  </div>

  <div class="main-title">大学入試<br>無敵の難単語 420</div>

  <!-- タブナビゲーション -->
  <div class="nav-tabs">
    <button class="tab-btn active" onclick="switchTab('config')">学習設定</button>
    <button class="tab-btn" onclick="switchTab('quiz')">テスト/カード</button>
    <button class="tab-btn" onclick="switchTab('list')">単語一覧</button>
  </div>

  <!-- 1. 設定パネル -->
  <div id="view-config" class="view-panel active">
    <div class="config-group">
      <label>モード選択</label>
      <select id="cfg-mode">
        <option value="choice">4択テスト</option>
        <option value="flash">フラッシュカード（スワイプ/判定）</option>
        <option value="judge">正誤判定テスト</option>
      </select>
    </div>

    <div class="config-group">
      <label>出題範囲</label>
      <select id="cfg-range" onchange="toggleCustomRange()">
        <option value="all">全範囲 (1-420)</option>
        <option value="day1">DAY 1 (1-30)</option>
        <option value="day2">DAY 2 (31-60)</option>
        <option value="day3">DAY 3 (61-90)</option>
        <option value="day4">DAY 4 (91-120)</option>
        <option value="day5">DAY 5 (121-150)</option>
        <option value="day6">DAY 6 (151-180)</option>
        <option value="day7">DAY 7 (181-210)</option>
        <option value="day8">DAY 8 (211-240)</option>
        <option value="day9">DAY 9 (241-270)</option>
        <option value="day10">DAY 10 (271-300)</option>
        <option value="day11">DAY 11 (301-330)</option>
        <option value="day12">DAY 12 (331-360)</option>
        <option value="day13">DAY 13 (361-390)</option>
        <option value="day14">DAY 14 (391-420)</option>
        <option value="unlearned">覚圧未完成・未覚(ステータス別)</option>
        <option value="custom">番号を直接指定</option>
      </select>
    </div>

    <div id="custom-range-box" class="config-group" style="display:none;">
      <label>開始No. ~ 終了No.</label>
      <div style="display:flex; gap:5px;">
        <input type="number" id="cfg-start" value="1" min="1" max="420">
        <input type="number" id="cfg-end" value="420" min="1" max="420">
      </div>
    </div>

    <div class="config-group">
      <label>出題数</label>
      <select id="cfg-count">
        <option value="10">10問</option>
        <option value="20">20問</option>
        <option value="30">30問</option>
        <option value="all">対象全問</option>
      </select>
    </div>

    <div class="config-group">
      <label>1問の制限時間 (秒)</label>
      <input type="number" id="cfg-time" value="5" min="1" max="60">
    </div>

    <button class="start-btn" onclick="startSession()">学習を開始する</button>
  </div>

  <!-- 2. 学習画面 -->
  <div id="view-quiz" class="view-panel">
    <div class="pinnacle-box" id="card-box" onclick="revealCardDetails()">
      <div class="word-meta">
        <span class="word-number" id="word-num">No. --</span>
        <span class="pinnacle-text">PINNACLE</span>
      </div>
      <div class="question-word" id="word-display">---</div>
      <div class="phonetic-symbol">
        <span id="phonetic-display">/---/</span>
        <button class="audio-btn" onclick="playAudio(event)">🔊</button>
      </div>

      <!-- 意味（フラッシュカード時またはタップ時に表示） -->
      <div class="meaning-display" id="meaning-display" style="display:none;">---</div>
      <div class="example-sentence" id="example-display" style="display:none;">---</div>
      
      <div class="timer-container" id="timer-container">
        <div class="timer-bar" id="timer-bar"></div>
      </div>
      <div class="timer-text" id="timer-text">制限時間: --秒</div>
    </div>

    <!-- 4択 / 正誤モード用ボタン -->
    <div class="options-section" id="options-container"></div>

    <!-- フラッシュカード用判定ボタン -->
    <div class="flash-controls" id="flash-controls" style="display:none;">
      <button class="flash-btn btn-ng" onclick="processResult(false)">覚えてない (←)</button>
      <button class="flash-btn btn-ok" onclick="processResult(true)">覚えた (→)</button>
    </div>

    <!-- アクションメッセージ -->
    <div class="action-section">
      <div class="status-message" id="status-message"></div>
      <button class="next-btn" id="next-btn" onclick="nextQuestion()">次の問題へ</button>
    </div>
  </div>

  <!-- 3. 単語一覧画面 -->
  <div id="view-list" class="view-panel">
    <div class="list-container" id="list-container"></div>
  </div>

  <!-- フッター -->
  <div class="footer-banner">
    英単語<span>は</span>極限<span>まで</span>覚えろ！
  </div>
</div>

  // --- ローカルストレージ（習熟度状態） ---
  // 各単語の状態: { streak: 連続正解数, status: 0(未), 1(覚えた:3回以上), 2(完璧:5回以上) }
  let userProgress = JSON.parse(localStorage.getItem('pinnacle_progress')) || {};

  function saveProgress() {
    localStorage.setItem('pinnacle_progress', JSON.stringify(userProgress));
  }

  function getWordState(id) {
    if (!userProgress[id]) {
      userProgress[id] = { streak: 0, status: 0 };
    }
    return userProgress[id];
  }

  // 連続正解カウント処理
  function updateWordProgress(id, isCorrect) {
    let state = getWordState(id);
    if (isCorrect) {
      state.streak += 1;
      if (state.streak >= 5) {
        state.status = 2; // 完璧
      } else if (state.streak >= 3) {
        state.status = 1; // 覚えた
      }
    } else {
      state.streak = 0;
      state.status = 0; // 覚えてない側に入る
    }
    saveProgress();
  }

  // --- タブ切り替え ---
  function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.view-panel').forEach(panel => panel.classList.remove('active'));

    if (tab === 'config') {
      document.querySelectorAll('.tab-btn')[0].classList.add('active');
      document.getElementById('view-config').classList.add('active');
    } else if (tab === 'quiz') {
      document.querySelectorAll('.tab-btn')[1].classList.add('active');
      document.getElementById('view-quiz').classList.add('active');
    } else if (tab === 'list') {
      document.querySelectorAll('.tab-btn')[2].classList.add('active');
      document.getElementById('view-list').classList.add('active');
      renderWordList();
    }
  }

  function toggleCustomRange() {
    const val = document.getElementById('cfg-range').value;
    document.getElementById('custom-range-box').style.display = (val === 'custom') ? 'block' : 'none';
  }

  // --- 学習セッション変数 ---
  let activeQueue = [];
  let currentSessionIdx = 0;
  let mode = 'choice';
  let limitTime = 5;
  let timerInterval = null;
  let remainingTime = 0;
  let isAnswered = false;

  function startSession() {
    mode = document.getElementById('cfg-mode').value;
    limitTime = parseInt(document.getElementById('cfg-time').value) || 5;

    // 範囲抽出
    const rangeVal = document.getElementById('cfg-range').value;
    let list = [];

    if (rangeVal.startsWith('day')) {
      const dayNum = parseInt(rangeVal.replace('day', ''));
      const start = (dayNum - 1) * 30 + 1;
      const end = dayNum * 30;
      list = fullVocabulary.filter(w => w.id >= start && w.id <= end);
    } else if (rangeVal === 'custom') {
      const s = parseInt(document.getElementById('cfg-start').value) || 1;
      const e = parseInt(document.getElementById('cfg-end').value) || 420;
      list = fullVocabulary.filter(w => w.id >= s && w.id <= e);
    } else if (rangeVal === 'unlearned') {
      list = fullVocabulary.filter(w => getWordState(w.id).status < 2);
    } else {
      list = [...fullVocabulary];
    }

    if (list.length === 0) {
      alert("該当する単語がありません");
      return;
    }

    // 出題数
    const countVal = document.getElementById('cfg-count').value;
    if (countVal !== 'all') {
      const cnt = parseInt(countVal);
      // ランダムシャッフルして指定数取得
      list = list.sort(() => Math.random() - 0.5).slice(0, cnt);
    }

    activeQueue = list;
    currentSessionIdx = 0;
    switchTab('quiz');
    loadQuestion();
  }

  // 問題ロード
  function loadQuestion() {
    if (currentSessionIdx >= activeQueue.length) {
      alert("セッションが終了しました！");
      switchTab('config');
      return;
    }

    isAnswered = false;
    document.getElementById("status-message").textContent = "";
    document.getElementById("status-message").className = "status-message";
    document.getElementById("next-btn").style.display = "none";
    document.getElementById("meaning-display").style.display = "none";
    document.getElementById("example-display").style.display = "none";

    const item = activeQueue[currentSessionIdx];

    document.getElementById("word-num").textContent = `No. ${item.id} / 420 (連勝:${getWordState(item.id).streak})`;
    document.getElementById("word-display").textContent = item.word;
    document.getElementById("phonetic-display").textContent = item.ipa;
    document.getElementById("meaning-display").textContent = item.meaning;
    document.getElementById("example-display").textContent = `Ex: ${item.sentence}`;

    const optContainer = document.getElementById("options-container");
    const flashControls = document.getElementById("flash-controls");
    const timerContainer = document.getElementById("timer-container");

    optContainer.innerHTML = "";

    if (mode === 'flash') {
      optContainer.style.display = "none";
      flashControls.style.display = "flex";
      timerContainer.style.display = "none";
      document.getElementById("timer-text").style.display = "none";
      document.getElementById("meaning-display").style.display = "block";
      document.getElementById("example-display").style.display = "block";
    } else {
      optContainer.style.display = "flex";
      flashControls.style.display = "none";
      timerContainer.style.display = "block";
      document.getElementById("timer-text").style.display = "block";

      if (mode === 'choice') {
        renderChoiceOptions(item);
      } else if (mode === 'judge') {
        renderJudgeOptions(item);
      }
      startTimer();
    }
  }

  // 4択選択肢の作成
  function renderChoiceOptions(item) {
    const optContainer = document.getElementById("options-container");
    const distractors = [];
    while (distractors.length < 3) {
      const rand = fullVocabulary[Math.floor(Math.random() * fullVocabulary.length)];
      if (rand.id !== item.id && !distractors.includes(rand.meaning)) {
        distractors.push(rand.meaning);
      }
    }
    const options = [item.meaning, ...distractors].sort(() => Math.random() - 0.5);
    const correctIdx = options.indexOf(item.meaning);

    options.forEach((opt, idx) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = `${idx + 1}. ${opt}`;
      btn.onclick = (e) => { e.stopPropagation(); handleSelect(idx === correctIdx, btn); };
      optContainer.appendChild(btn);
    });
  }

  // 正誤判定用の作成
  function renderJudgeOptions(item) {
    const optContainer = document.getElementById("options-container");
    const isTrue = Math.random() > 0.5;
    let shownMeaning = item.meaning;

    if (!isTrue) {
      let randItem;
      do {
        randItem = fullVocabulary[Math.floor(Math.random() * fullVocabulary.length)];
      } while (randItem.id === item.id);
      shownMeaning = randItem.meaning;
    }

    document.getElementById("meaning-display").textContent = `意味: ${shownMeaning}`;
    document.getElementById("meaning-display").style.display = "block";

    const btn1 = document.createElement("button");
    btn1.className = "option-btn";
    btn1.textContent = "◯ 正しい";
    btn1.onclick = (e) => { e.stopPropagation(); handleSelect(isTrue, btn1); };

    const btn2 = document.createElement("button");
    btn2.className = "option-btn";
    btn2.textContent = "✕ 誤り";
    btn2.onclick = (e) => { e.stopPropagation(); handleSelect(!isTrue, btn2); };

    optContainer.appendChild(btn1);
    optContainer.appendChild(btn2);
  }

  // 時間内でもカードタップで詳細を表示
  function revealCardDetails() {
    document.getElementById("meaning-display").style.display = "block";
    document.getElementById("example-display").style.display = "block";
  }

  // 音声再生
  function playAudio(e) {
    e.stopPropagation();
    const word = activeQueue[currentSessionIdx].word;
    const uttr = new SpeechSynthesisUtterance(word);
    uttr.lang = 'en-US';
    window.speechSynthesis.speak(uttr);
  }

  // タイマー処理
  function startTimer() {
    clearInterval(timerInterval);
    remainingTime = limitTime;
    const startTime = Date.now();

    timerInterval = setInterval(() => {
      const elapsed = (Date.now() - startTime) / 1000;
      remainingTime = Math.max(0, limitTime - elapsed);

      const pct = (remainingTime / limitTime) * 100;
      document.getElementById("timer-bar").style.width = `${pct}%`;
      document.getElementById("timer-text").textContent = `残り時間: ${remainingTime.toFixed(1)}秒`;

      if (remainingTime <= 0) {
        clearInterval(timerInterval);
        handleTimeout();
      }
    }, 50);
  }

  // 回答選択処理
  function handleSelect(isCorrect, btnObj) {
    if (isAnswered) return;
    isAnswered = true;
    clearInterval(timerInterval);

    const item = activeQueue[currentSessionIdx];
    updateWordProgress(item.id, isCorrect);

    revealCardDetails();

    const statusMsg = document.getElementById("status-message");
    if (isCorrect) {
      statusMsg.textContent = "正解！";
      statusMsg.className = "status-message correct-text";
      if (btnObj) btnObj.classList.add("correct");
    } else {
      statusMsg.textContent = "不正解...";
      statusMsg.className = "status-message wrong-text";
      if (btnObj) btnObj.classList.add("wrong");
    }

    document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);
    document.getElementById("next-btn").style.display = "block";
  }

  // タイムアウト処理
  function handleTimeout() {
    if (isAnswered) return;
    isAnswered = true;

    const item = activeQueue[currentSessionIdx];
    updateWordProgress(item.id, false); // 間違えた扱い（覚えてない側）

    revealCardDetails();

    const statusMsg = document.getElementById("status-message");
    statusMsg.textContent = "時間切れ！自動で正解・例文を表示します";
    statusMsg.className = "status-message timeout";

    document.querySelectorAll(".option-btn").forEach(b => b.disabled = true);
    document.getElementById("next-btn").style.display = "block";
  }

  // フラッシュカード判定
  function processResult(isOk) {
    const item = activeQueue[currentSessionIdx];
    updateWordProgress(item.id, isOk);
    nextQuestion();
  }

  function nextQuestion() {
    currentSessionIdx++;
    loadQuestion();
  }

  // --- スワイプ判定 (フラッシュカード時) ---
  let touchStartX = 0;
  let touchEndX = 0;
  const cardBox = document.getElementById("card-box");

  cardBox.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
  });

  cardBox.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    if (mode === 'flash') {
      if (touchStartX - touchEndX > 50) {
        processResult(false); // 左スワイプ -> 覚えてない
      } else if (touchEndX - touchStartX > 50) {
        processResult(true);  // 右スワイプ -> 覚えた
      }
    }
  });

  // --- 単語一覧の描画 ---
  function renderWordList() {
    const container = document.getElementById("list-container");
    container.innerHTML = "";

    fullVocabulary.forEach(w => {
      const st = getWordState(w.id);
      const div = document.createElement("div");
      div.className = "list-item";

      let badgeTxt = "未習得";
      let badgeClass = "status-0";
      if (st.status === 2) {
        badgeTxt = "完璧 (5回連勝)";
        badgeClass = "status-2";
      } else if (st.status === 1) {
        badgeTxt = "覚えた (3回連勝)";
        badgeClass = "status-1";
      }

      div.innerHTML = `
        <div class="word-info">
          <div><span class="word-en">No.${w.id} ${w.word}</span> <small>${w.ipa}</small></div>
          <div class="word-ja">${w.meaning}</div>
        </div>
        <span class="status-badge ${badgeClass}">${badgeTxt}</span>
      `;
      container.appendChild(div);
    });
  }
</script>
</body>
</html>
